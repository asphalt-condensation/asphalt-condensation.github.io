name: Quality

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install project tooling and dependencies
        run: npm ci
      - name: Run public-safety, static, and build checks
        run: npx rocket site check
      - name: Install Chromium
        run: npx rocket site browsers-ci
      - name: Run browser tests
        run: npx rocket site test
